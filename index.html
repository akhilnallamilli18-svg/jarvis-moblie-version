<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>J.A.R.V.I.S - Mobile</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- ===============================
         HEADER
    ================================ -->

    <header>

        <h1>J.A.R.V.I.S</h1>

        <p>MOBILE EDITION</p>

    </header>


    <!-- ===============================
         ARC REACTOR CORE
    ================================ -->

    <div class="core">

        <div class="ring r1"></div>

        <div class="ring r2"></div>

        <div class="center"></div>

    </div>


    <p class="core-text">
        CORE ACTIVE
    </p>


    <!-- ===============================
         SYSTEM STATUS
    ================================ -->

    <div class="status">

        <h2>SYSTEM STATUS</h2>


        <div class="row">

            <span>AI CORE</span>

            <b
                id="ai-status"
                class="on"
            >
                ● ONLINE
            </b>

        </div>


        <div class="row">

            <span>NETWORK</span>

            <b
                id="network-status"
                class="on"
            >
                ● ONLINE
            </b>

        </div>


        <div class="row">

            <span>VOICE</span>

            <b
                id="voice-status"
                class="on"
            >
                ● ONLINE
            </b>

        </div>


        <div class="row">

            <span>MEMORY</span>

            <b
                id="memory-status"
                class="on"
            >
                ● ACTIVE
            </b>

        </div>

    </div>


    <!-- ===============================
         CHAT AREA
    ================================ -->

    <div
        class="chat"
        id="chat"
    ></div>


    <!-- ===============================
         INPUT AREA
    ================================ -->

    <div class="input-area">


        <!-- TEXT INPUT -->

        <input
            id="msg"
            type="text"
            placeholder="Ask J.A.R.V.I.S..."
            autocomplete="off"
        >


        <!-- SEND BUTTON -->

        <button
            id="send"
        >
            SEND
        </button>


        <!-- VOICE BUTTON -->

        <button
            id="mic-btn"
            aria-label="Activate voice input"
        >
            🎙️
        </button>


        <!-- CAMERA / VISION BUTTON -->

        <button
            id="cam-btn"
            aria-label="Analyze image"
        >
            📷
        </button>


        <!--
            HIDDEN IMAGE INPUT

            On mobile devices this can allow
            camera/gallery selection.
        -->

        <input
            id="img-input"
            type="file"
            accept="image/*"
            capture="environment"
            style="display:none"
        >


        <!-- CLEAR MEMORY BUTTON -->

        <button
            id="clear-btn"
        >
            CLEAR
        </button>

    </div>


    <!-- ===============================
         JAVASCRIPT
    ================================ -->

    <script src="script.js"></script>

</body>

</html>
